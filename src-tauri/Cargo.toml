[package]
name = "null-file"
version = "1.0.0"
description = "Null File - a Neon Lab file manager for Linux"
authors = ["Luke"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "null_file_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
notify = "6"
notify-debouncer-mini = "0.4"
filetime = "0.2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
